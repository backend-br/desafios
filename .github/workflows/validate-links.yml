name: Validate links

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: validate-links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-links:
    name: Validate links
    permissions:
      issues: write
      contents: read
    uses: backend-br/.github/.github/workflows/validate-links.yml@main
