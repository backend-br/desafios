name: Auto assign issues and pull requests

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

concurrency:
  group: auto-assign-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-assign:
    name: Auto assign
    permissions:
      issues: write
      pull-requests: write
    uses: backend-br/.github/.github/workflows/auto-assign.yml@main
    with:
      assignment-options: 'ISSUE,PULL_REQUEST'
